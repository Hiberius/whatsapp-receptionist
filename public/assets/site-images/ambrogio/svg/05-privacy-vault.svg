      <path d="M260 310 L412 374 V470 C412 560 330 604 260 624 C190 604 108 560 108 470 V374 Z" fill="url(#primary-a4)"/>
      <path d="M206 462 L246 502 L326 414" stroke="#fff" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(820 150)">
      <rect x="0" y="0" width="260" height="150" rx="34" fill="#fff" opacity=".86" filter="url(#smallShadow-a4)"/><text x="34" y="74" fill="#111827" font-size="32" font-weight="820" opacity="1">Tenant A</text><rect x="34" y="94" width="150" height="14" rx="7" fill="#065f46" opacity=".55"/><rect x="300" y="0" width="260" height="150" rx="34" fill="#fff" opacity=".86" filter="url(#smallShadow-a4)"/><text x="334" y="74" fill="#111827" font-size="32" font-weight="820" opacity="1">Tenant B</text><rect x="334" y="94" width="150" height="14" rx="7" fill="#0ea5e9" opacity=".55"/><rect x="0" y="190" width="260" height="150" rx="34" fill="#fff" opacity=".86" filter="url(#smallShadow-a4)"/><text x="34" y="264" fill="#111827" font-size="32" font-weight="820" opacity="1">Audit log</text><rect x="34" y="284" width="150" height="14" rx="7" fill="#065f46" opacity=".55"/><rect x="300" y="190" width="260" height="150" rx="34" fill="#fff" opacity=".86" filter="url(#smallShadow-a4)"/><text x="334" y="264" fill="#111827" font-size="32" font-weight="820" opacity="1">DPA</text><rect x="334" y="284" width="150" height="14" rx="7" fill="#0ea5e9" opacity=".55"/>
