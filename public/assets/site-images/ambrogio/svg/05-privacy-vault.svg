<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-a4 desc-a4">
  <title id="title-a4">Privacy e DPA</title>
  <desc id="desc-a4">Dati cliente protetti in un vault privacy-first con audit log</desc>
  
  <defs>
    <linearGradient id="bg-a4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="46%" stop-color="#97d33b"/>
      <stop offset="100%" stop-color="#3b816e"/>
    </linearGradient>
    <linearGradient id="primary-a4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="accent-a4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <radialGradient id="glow-a4" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity=".45"/>
      <stop offset="70%" stop-color="#84cc16" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow-a4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <filter id="smallShadow-a4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <pattern id="grid-a4" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M 58 0 L 0 0 0 58" fill="none" stroke="#0f172a" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="dots-a4" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#0f172a" opacity=".06"/>
    </pattern>
    <clipPath id="phoneClip-a4">
      <rect x="0" y="0" width="360" height="700" rx="48"/>
    </clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg-a4)"/>
  <rect width="1600" height="1000" fill="url(#grid-a4)"/>
  <circle cx="1240" cy="260" r="360" fill="url(#glow-a4)"/>
  <circle cx="320" cy="820" r="300" fill="#0ea5e9" opacity=".07"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    
    <g transform="translate(170 120)">
