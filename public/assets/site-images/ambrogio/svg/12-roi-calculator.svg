      <text x="62" y="305" fill="#334155" font-size="28" font-weight="750">Richieste perse</text><rect x="360" y="272" width="130" height="44" rx="22" fill="#f1f5f9"/><text x="402" y="303" fill="#0f172a" font-size="26" font-weight="850">12</text><text x="62" y="397" fill="#334155" font-size="28" font-weight="750">Ticket medio</text><rect x="360" y="364" width="130" height="44" rx="22" fill="#f1f5f9"/><text x="402" y="395" fill="#0f172a" font-size="26" font-weight="850">80</text><text x="62" y="489" fill="#334155" font-size="28" font-weight="750">Appuntamenti recuperati</text><rect x="360" y="456" width="130" height="44" rx="22" fill="#f1f5f9"/><text x="402" y="487" fill="#0f172a" font-size="26" font-weight="850">7</text>
      <rect x="62" y="550" width="430" height="64" rx="32" fill="url(#primary-a11)"/>
      <text x="96" y="592" fill="#fff" font-size="32" font-weight="850" opacity="1">+560 euro stimati</text>
