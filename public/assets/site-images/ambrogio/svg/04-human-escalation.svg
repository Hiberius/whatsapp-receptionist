  </g>
      <g filter="url(#smallShadow-a0)"><rect x="58" y="500" width="300" height="58" rx="29" fill="#0f172a" opacity="1" /><text x="86" y="539" fill="#fff" font-size="22" font-weight="750" opacity="1">Escalation sicura</text></g>
