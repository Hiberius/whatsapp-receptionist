<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-a11 desc-a11">
  <title id="title-a11">ROI calculator</title>
  <desc id="desc-a11">Calcolo ritorno economico degli appuntamenti recuperati con Ambrogio</desc>
  
  <defs>
    <linearGradient id="bg-a11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="46%" stop-color="#4ddac9"/>
      <stop offset="100%" stop-color="#424958"/>
    </linearGradient>
    <linearGradient id="primary-a11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="accent-a11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow-a11" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity=".45"/>
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow-a11" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity=".16"/>
