<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Landing page preview — WhatsApp Receptionist">
  <title>Landing page · WhatsApp Receptionist</title>
  <defs>
    <linearGradient id="land-bg" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAFAF6"/>
      <stop offset="1" stop-color="#F0EDE2"/>
    </linearGradient>
    <pattern id="land-grain" patternUnits="userSpaceOnUse" width="3" height="3">
      <circle cx="1" cy="1" r="0.3" fill="#0F4F4A" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#land-bg)"/>
  <rect width="1280" height="800" fill="url(#land-grain)"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1280" height="44" fill="#0F4F4A"/>
  <circle cx="20" cy="22" r="6" fill="#E8C56A"/>
  <circle cx="40" cy="22" r="6" fill="#F5F1E8" opacity="0.5"/>
  <circle cx="60" cy="22" r="6" fill="#F5F1E8" opacity="0.3"/>
  <rect x="240" y="12" width="800" height="22" rx="11" fill="#F5F1E8" opacity="0.15"/>
  <text x="640" y="28" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F5F1E8" text-anchor="middle">whatsapp-receptionist.dev</text>

  <!-- Top nav -->
  <rect x="0" y="44" width="1280" height="64" fill="#FAFAF6"/>
  <g font-family="Fraunces, Georgia, serif" fill="#0F4F4A">
    <text x="80" y="84" font-size="20" font-weight="600" letter-spacing="-0.4">WhatsApp</text>
    <text x="186" y="84" font-size="20" font-weight="400" font-style="italic" letter-spacing="-0.4">Receptionist</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#2A3938">
    <text x="700" y="84">Features</text>
    <text x="780" y="84">Pricing</text>
    <text x="850" y="84">Verticals</text>
    <text x="930" y="84">Docs</text>
    <text x="990" y="84">Blog</text>
  </g>
  <rect x="1080" y="64" width="120" height="36" rx="18" fill="#0F4F4A"/>
  <text x="1140" y="86" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F5F1E8" text-anchor="middle">Get started</text>

  <!-- Hero -->
  <g font-family="Fraunces, Georgia, serif" fill="#0F4F4A">
    <g font-family="Inter, system-ui, sans-serif" font-size="13" letter-spacing="2" font-weight="500" fill="#5C6B68">
      <text x="80" y="200">OPEN SOURCE · MIT · CRAFTED IN ITALY</text>
    </g>
    <text x="80" y="290" font-size="64" font-weight="600" letter-spacing="-2">L'AI receptionist</text>
    <text x="80" y="360" font-size="64" font-weight="400" font-style="italic" letter-spacing="-2">che prende appuntamenti</text>
    <text x="80" y="430" font-size="64" font-weight="600" letter-spacing="-2">veri su WhatsApp.</text>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="18" fill="#2A3938">
    <text x="80" y="490">Risponde 24/7, capisce l'intent, prenota su Google Calendar.</text>
    <text x="80" y="518">Solo italiano vero, voce decente, GDPR by default.</text>
  </g>

  <rect x="80" y="560" width="180" height="52" rx="26" fill="#0F4F4A"/>
  <text x="170" y="592" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#F5F1E8" text-anchor="middle">Inizia gratis</text>
  <rect x="280" y="560" width="180" height="52" rx="26" fill="none" stroke="#0F4F4A" stroke-width="1.5"/>
  <text x="370" y="592" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0F4F4A" text-anchor="middle">Vedi demo</text>

  <!-- Right side: phone mock -->
  <g transform="translate(800 180)">
    <rect width="320" height="500" rx="36" fill="#0F4F4A"/>
    <rect x="14" y="14" width="292" height="472" rx="24" fill="#F5F1E8"/>

    <!-- WhatsApp header -->
    <rect x="14" y="14" width="292" height="56" rx="24" fill="#1A6F68"/>
    <rect x="14" y="40" width="292" height="30" fill="#1A6F68"/>
    <circle cx="50" cy="42" r="14" fill="#F5F1E8"/>
    <text x="74" y="38" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F5F1E8">Studio Dr. Rossi</text>
    <text x="74" y="55" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#E8C56A">online · AI</text>

    <!-- messages -->
    <rect x="40" y="100" width="200" height="40" rx="12" fill="#FFFFFF" stroke="#E5E2D6" stroke-width="1"/>
    <text x="52" y="118" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#2A3938">Salve! Vorrei una visita</text>
    <text x="52" y="132" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#2A3938">per la prossima settimana</text>

    <rect x="80" y="160" width="220" height="60" rx="12" fill="#1A6F68"/>
    <text x="92" y="178" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F5F1E8">Certo! Ho disponibilità</text>
    <text x="92" y="192" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F5F1E8">martedì 14 alle 10:30</text>
    <text x="92" y="208" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F5F1E8">o giovedì 16 alle 15:00.</text>

    <rect x="40" y="240" width="160" height="32" rx="12" fill="#FFFFFF" stroke="#E5E2D6" stroke-width="1"/>
    <text x="52" y="260" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#2A3938">Martedì alle 10:30</text>

    <rect x="80" y="290" width="220" height="76" rx="12" fill="#1A6F68"/>
    <text x="92" y="310" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F5F1E8">Perfetto! Ho prenotato:</text>
    <text x="92" y="326" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#E8C56A">📅 Mar 14, 10:30</text>
    <text x="92" y="342" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F5F1E8">Confermo via SMS al</text>
    <text x="92" y="358" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F5F1E8">numero che ha scritto.</text>

    <!-- typing indicator -->
    <rect x="40" y="386" width="50" height="20" rx="10" fill="#FFFFFF" stroke="#E5E2D6" stroke-width="1"/>
    <circle cx="56" cy="396" r="2" fill="#5C6B68"/>
    <circle cx="65" cy="396" r="2" fill="#5C6B68" opacity="0.6"/>
    <circle cx="74" cy="396" r="2" fill="#5C6B68" opacity="0.3"/>
  </g>

  <!-- Footer info -->
  <g font-family="Inter, system-ui, sans-serif" font-size="12" fill="#5C6B68">
    <text x="80" y="760">⭐ 369 test verdi · 🛡 GDPR-ready · 🇮🇹 SDI integrato · ⚡ Multi-tenant</text>
  </g>
</svg>
