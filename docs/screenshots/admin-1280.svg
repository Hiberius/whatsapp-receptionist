<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Super-admin panel preview">
  <title>Admin · WhatsApp Receptionist</title>
  <rect width="1280" height="800" fill="#0F4F4A"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1280" height="44" fill="#0A3935"/>
  <circle cx="20" cy="22" r="6" fill="#E8C56A"/>
  <circle cx="40" cy="22" r="6" fill="#F5F1E8" opacity="0.5"/>
  <circle cx="60" cy="22" r="6" fill="#F5F1E8" opacity="0.3"/>
  <rect x="240" y="12" width="800" height="22" rx="11" fill="#F5F1E8" opacity="0.1"/>
  <text x="640" y="28" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F5F1E8" text-anchor="middle">app.whatsapp-receptionist.dev/admin</text>

  <!-- Sidebar -->
  <rect x="0" y="44" width="240" height="756" fill="#0A3935"/>

  <g font-family="Fraunces, Georgia, serif">
    <text x="24" y="84" font-size="14" font-weight="600" letter-spacing="-0.3" fill="#E8C56A">Super-Admin</text>
    <text x="24" y="104" font-size="11" font-family="Inter, system-ui, sans-serif" fill="#F5F1E8" opacity="0.6">Cross-tenant control</text>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F5F1E8">
    <rect x="16" y="140" width="208" height="36" rx="8" fill="#1A6F68"/>
    <text x="40" y="162" font-weight="600">📊 Overview</text>

    <text x="40" y="200" opacity="0.7">🏢 Tenants</text>
    <rect x="186" y="186" width="32" height="20" rx="10" fill="#E8C56A"/>
    <text x="202" y="200" font-size="11" font-weight="700" fill="#0F4F4A" text-anchor="middle">142</text>

    <text x="40" y="238" opacity="0.7">👥 Users</text>
    <text x="40" y="276" opacity="0.7">💳 Billing</text>
    <text x="40" y="314" opacity="0.7">🔍 Audit log</text>
    <text x="40" y="352" opacity="0.7">⚙️  System</text>
  </g>

  <!-- Main -->
  <g transform="translate(280 80)" font-family="Fraunces, Georgia, serif">
    <text font-size="32" font-weight="600" letter-spacing="-0.8" fill="#F5F1E8">Cross-tenant overview</text>
    <text font-size="13" font-family="Inter, system-ui, sans-serif" fill="#F5F1E8" opacity="0.6" y="28">Production · 142 tenant attivi · 18.4M conv/mese</text>
  </g>

  <!-- Stat row -->
  <g transform="translate(280 180)" font-family="Inter, system-ui, sans-serif">
    <rect width="220" height="120" rx="14" fill="#0F4F4A" stroke="#1A6F68" stroke-width="1"/>
    <text x="20" y="36" font-size="11" font-weight="600" letter-spacing="1.2" fill="#E8C56A">TENANT TOTALI</text>
    <text x="20" y="84" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#F5F1E8">142</text>
    <text x="20" y="104" font-size="11" fill="#F5F1E8" opacity="0.6">+8 questa settimana</text>

    <rect x="240" width="220" height="120" rx="14" fill="#0F4F4A" stroke="#1A6F68" stroke-width="1"/>
    <text x="260" y="36" font-size="11" font-weight="600" letter-spacing="1.2" fill="#E8C56A">MRR</text>
    <text x="260" y="84" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#F5F1E8">€12.6k</text>
    <text x="260" y="104" font-size="11" fill="#16A34A">+€840 vs scorso</text>

    <rect x="480" width="220" height="120" rx="14" fill="#0F4F4A" stroke="#1A6F68" stroke-width="1"/>
    <text x="500" y="36" font-size="11" font-weight="600" letter-spacing="1.2" fill="#E8C56A">CHURN</text>
    <text x="500" y="84" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#F5F1E8">2.1<tspan font-size="22" fill="#F5F1E8" opacity="0.6">%</tspan></text>
    <text x="500" y="104" font-size="11" fill="#F5F1E8" opacity="0.6">trailing 30d</text>

    <rect x="720" width="220" height="120" rx="14" fill="#E8C56A"/>
    <text x="740" y="36" font-size="11" font-weight="600" letter-spacing="1.2" fill="#0F4F4A">SISTEMA</text>
    <text x="740" y="74" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#0F4F4A">All systems go</text>
    <circle cx="744" cy="98" r="4" fill="#16A34A"/>
    <text x="754" y="102" font-size="11" font-weight="500" fill="#0F4F4A">99.97% uptime · p95 240ms</text>
