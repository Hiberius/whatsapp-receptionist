      <rect x="95" y="240" width="74" height="180" rx="24" fill="#0f172a" opacity="0.48"/><rect x="215" y="120" width="74" height="300" rx="24" fill="#0f172a" opacity="0.6799999999999999"/><rect x="335" y="10" width="74" height="410" rx="24" fill="#f43f5e" opacity="0.88"/>
