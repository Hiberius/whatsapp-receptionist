<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WhatsApp Receptionist icon">
  <title>WhatsApp Receptionist</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F4F4A"/>
      <stop offset="1" stop-color="#1A6F68"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Chat bubble outline -->
  <path d="M16 22 a8 8 0 0 1 8 -8 h16 a8 8 0 0 1 8 8 v10 a8 8 0 0 1 -8 8 h-12 l-8 6 v-6 a8 8 0 0 1 -4 -7 z"
        fill="none" stroke="#F5F1E8" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- AI listening dots -->
  <circle cx="26" cy="27" r="2" fill="#F5F1E8"/>
  <circle cx="32" cy="27" r="2" fill="#F5F1E8" opacity="0.7"/>
  <circle cx="38" cy="27" r="2" fill="#F5F1E8" opacity="0.4"/>
  <!-- Spark / AI indicator -->
  <path d="M44 14 l1.5 3 l3 1.5 l-3 1.5 l-1.5 3 l-1.5 -3 l-3 -1.5 l3 -1.5 z" fill="#E8C56A"/>
</svg>
