      <text x="280" y="56" font-size="11" font-weight="600" letter-spacing="1" fill="#F5F1E8" opacity="0.6">VERTICALE</text>
      <text x="450" y="56" font-size="11" font-weight="600" letter-spacing="1" fill="#F5F1E8" opacity="0.6">PIANO</text>
      <text x="580" y="56" font-size="11" font-weight="600" letter-spacing="1" fill="#F5F1E8" opacity="0.6">USO</text>
      <text x="780" y="56" font-size="11" font-weight="600" letter-spacing="1" fill="#F5F1E8" opacity="0.6">STATO</text>

      <g transform="translate(0 100)">
        <text x="20" font-weight="600">Studio Rossi</text>
        <text x="20" y="18" font-size="11" opacity="0.6">studio-rossi.tenant</text>
        <text x="280">Dental</text>
        <text x="450">Pro</text>
        <text x="580">1.247 / 1.500</text>
        <rect x="780" y="-14" width="84" height="22" rx="11" fill="#16A34A"/>
        <text x="822" y="0" font-size="11" font-weight="600" fill="#F5F1E8" text-anchor="middle">attivo</text>
      </g>

      <line x1="0" y1="160" x2="940" y2="160" stroke="#1A6F68" opacity="0.4"/>
      <g transform="translate(0 180)">
        <text x="20" font-weight="600">Bella Estetica</text>
        <text x="20" y="18" font-size="11" opacity="0.6">bella-estetica.tenant</text>
        <text x="280">Beauty</text>
        <text x="450">Pro</text>
        <text x="580">892 / 1.500</text>
        <rect x="780" y="-14" width="84" height="22" rx="11" fill="#16A34A"/>
        <text x="822" y="0" font-size="11" font-weight="600" fill="#F5F1E8" text-anchor="middle">attivo</text>
      </g>

      <line x1="0" y1="240" x2="940" y2="240" stroke="#1A6F68" opacity="0.4"/>
      <g transform="translate(0 260)">
        <text x="20" font-weight="600">Centro Fitness Plus</text>
        <text x="20" y="18" font-size="11" opacity="0.6">cfplus.tenant</text>
        <text x="280">Fitness</text>
        <text x="450">Enterprise</text>
        <text x="580">3.421 / ∞</text>
        <rect x="780" y="-14" width="84" height="22" rx="11" fill="#16A34A"/>
        <text x="822" y="0" font-size="11" font-weight="600" fill="#F5F1E8" text-anchor="middle">attivo</text>
      </g>

      <line x1="0" y1="320" x2="940" y2="320" stroke="#1A6F68" opacity="0.4"/>
      <g transform="translate(0 340)">
        <text x="20" font-weight="600">Studio Legale Verdi</text>
        <text x="20" y="18" font-size="11" opacity="0.6">verdi-law.tenant</text>
        <text x="280">Professional</text>
        <text x="450">Pro</text>
        <text x="580">412 / 1.500</text>
        <rect x="780" y="-14" width="84" height="22" rx="11" fill="#A16207"/>
        <text x="822" y="0" font-size="11" font-weight="600" fill="#F5F1E8" text-anchor="middle">trial</text>
      </g>
    </g>
