    <rect y="20" width="940" height="380" rx="14" fill="#0F4F4A" stroke="#1A6F68"/>

    <g font-size="13" fill="#F5F1E8">
      <line x1="0" y1="80" x2="940" y2="80" stroke="#1A6F68"/>
