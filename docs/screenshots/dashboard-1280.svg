<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Tenant dashboard preview">
  <title>Dashboard tenant · WhatsApp Receptionist</title>
  <rect width="1280" height="800" fill="#F8F6EE"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1280" height="44" fill="#0F4F4A"/>
  <circle cx="20" cy="22" r="6" fill="#E8C56A"/>
  <circle cx="40" cy="22" r="6" fill="#F5F1E8" opacity="0.5"/>
  <circle cx="60" cy="22" r="6" fill="#F5F1E8" opacity="0.3"/>
  <rect x="240" y="12" width="800" height="22" rx="11" fill="#F5F1E8" opacity="0.15"/>
  <text x="640" y="28" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#F5F1E8" text-anchor="middle">app.whatsapp-receptionist.dev/dashboard</text>

  <!-- Sidebar -->
  <rect x="0" y="44" width="240" height="756" fill="#FFFFFF"/>
  <line x1="240" y1="44" x2="240" y2="800" stroke="#E5E2D6" stroke-width="1"/>

  <g font-family="Fraunces, Georgia, serif" fill="#0F4F4A">
    <text x="24" y="84" font-size="16" font-weight="600" letter-spacing="-0.3">WhatsApp</text>
    <text x="110" y="84" font-size="16" font-weight="400" font-style="italic" letter-spacing="-0.3">Receptionist</text>
  </g>

  <!-- Workspace selector -->
  <rect x="24" y="110" width="192" height="44" rx="8" fill="#F0EDE2"/>
  <circle cx="44" cy="132" r="12" fill="#0F4F4A"/>
  <text x="44" y="136" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#E8C56A" text-anchor="middle">SR</text>
  <text x="68" y="128" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F4F4A">Studio Rossi</text>
  <text x="68" y="142" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5C6B68">Pro · 1.247 conv</text>

  <!-- Nav items -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2A3938">
    <rect x="24" y="180" width="192" height="36" rx="8" fill="#0F4F4A"/>
    <text x="48" y="202" fill="#F5F1E8" font-weight="600">⚡ Dashboard</text>

    <text x="48" y="240">💬 Conversazioni</text>
    <rect x="186" y="226" width="24" height="20" rx="10" fill="#E8C56A"/>
    <text x="198" y="240" font-size="11" font-weight="700" fill="#0F4F4A" text-anchor="middle">12</text>

    <text x="48" y="278">📅 Calendario</text>
    <text x="48" y="316">👥 Clienti</text>
    <text x="48" y="354">⚙️  Impostazioni</text>
    <text x="48" y="392">💳 Fatturazione</text>
    <text x="48" y="430">📊 Insights</text>
    <text x="48" y="468">🔌 Integrazioni</text>
  </g>

  <!-- Bottom user -->
  <line x1="24" y1="720" x2="216" y2="720" stroke="#E5E2D6"/>
  <circle cx="48" cy="752" r="14" fill="#1A6F68"/>
  <text x="48" y="756" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F1E8" text-anchor="middle">CR</text>
  <text x="72" y="748" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F4F4A">Christian R.</text>
  <text x="72" y="762" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5C6B68">Owner</text>

  <!-- Main content -->
  <g transform="translate(280 80)">
    <text font-family="Fraunces, Georgia, serif" font-size="32" font-weight="600" letter-spacing="-0.8" fill="#0F4F4A">Buongiorno, Christian</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" fill="#5C6B68" y="32">Ecco cosa è successo nelle ultime 24 ore.</text>
  </g>

  <!-- Stat cards -->
  <g transform="translate(280 180)">
    <rect width="220" height="120" rx="14" fill="#FFFFFF" stroke="#E5E2D6"/>
    <text x="20" y="36" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#5C6B68">CONVERSAZIONI 24H</text>
    <text x="20" y="84" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#0F4F4A">87</text>
    <text x="100" y="84" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#16A34A">+12%</text>
    <text x="20" y="104" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5C6B68">vs ieri</text>

    <rect x="240" width="220" height="120" rx="14" fill="#FFFFFF" stroke="#E5E2D6"/>
    <text x="260" y="36" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#5C6B68">APPUNTAMENTI</text>
    <text x="260" y="84" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#0F4F4A">23</text>
    <text x="340" y="84" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#16A34A">+5</text>
    <text x="260" y="104" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5C6B68">prenotati oggi</text>

    <rect x="480" width="220" height="120" rx="14" fill="#FFFFFF" stroke="#E5E2D6"/>
    <text x="500" y="36" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#5C6B68">RISOLUZIONE AI</text>
    <text x="500" y="84" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#0F4F4A">94<tspan font-size="22" fill="#5C6B68">%</tspan></text>
    <text x="500" y="104" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#5C6B68">senza intervento umano</text>

    <rect x="720" width="220" height="120" rx="14" fill="#0F4F4A"/>
    <text x="740" y="36" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#E8C56A">USO MENSILE</text>
    <text x="740" y="84" font-family="Fraunces, Georgia, serif" font-size="36" font-weight="600" fill="#F5F1E8">1.247</text>
    <text x="740" y="104" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F5F1E8" opacity="0.7">/ 1.500 incluse · 83%</text>
  </g>

  <!-- Conversations table -->
  <g transform="translate(280 340)">
    <text font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5" fill="#0F4F4A">CONVERSAZIONI RECENTI</text>
    <rect y="20" width="940" height="380" rx="14" fill="#FFFFFF" stroke="#E5E2D6"/>

    <!-- table rows -->
    <g font-family="Inter, system-ui, sans-serif" font-size="13">
      <line x1="0" y1="80" x2="940" y2="80" stroke="#E5E2D6"/>
      <text x="20" y="56" font-size="11" font-weight="600" letter-spacing="1" fill="#5C6B68">CLIENTE</text>
      <text x="320" y="56" font-size="11" font-weight="600" letter-spacing="1" fill="#5C6B68">ULTIMO MESSAGGIO</text>
      <text x="700" y="56" font-size="11" font-weight="600" letter-spacing="1" fill="#5C6B68">STATO</text>
      <text x="860" y="56" font-size="11" font-weight="600" letter-spacing="1" fill="#5C6B68">QUANDO</text>

      <g transform="translate(0 100)">
        <text x="20" font-weight="600" fill="#0F4F4A">Maria Bianchi</text>
        <text x="20" y="18" font-size="11" fill="#5C6B68">+39 348 ••••• 47</text>
        <text x="320" fill="#2A3938">Va bene martedì 10:30</text>
        <rect x="700" y="-14" width="84" height="22" rx="11" fill="#DCFCE7"/>
        <text x="742" y="0" font-size="11" font-weight="600" fill="#16A34A" text-anchor="middle">prenotato</text>
        <text x="860" fill="#5C6B68">2 min fa</text>
      </g>

      <line x1="0" y1="160" x2="940" y2="160" stroke="#E5E2D6"/>
      <g transform="translate(0 180)">
        <text x="20" font-weight="600" fill="#0F4F4A">Luca De Santis</text>
        <text x="20" y="18" font-size="11" fill="#5C6B68">+39 333 ••••• 12</text>
        <text x="320" fill="#2A3938">Vorrei spostare l'appuntamento</text>
        <rect x="700" y="-14" width="84" height="22" rx="11" fill="#FEF3C7"/>
        <text x="742" y="0" font-size="11" font-weight="600" fill="#A16207" text-anchor="middle">in corso</text>
        <text x="860" fill="#5C6B68">5 min fa</text>
      </g>

      <line x1="0" y1="240" x2="940" y2="240" stroke="#E5E2D6"/>
      <g transform="translate(0 260)">
        <text x="20" font-weight="600" fill="#0F4F4A">Giulia Conti</text>
        <text x="20" y="18" font-size="11" fill="#5C6B68">+39 392 ••••• 03</text>
        <text x="320" fill="#2A3938">🎤 Nota vocale (12s)</text>
        <rect x="700" y="-14" width="84" height="22" rx="11" fill="#FEE2E2"/>
        <text x="742" y="0" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">escalation</text>
        <text x="860" fill="#5C6B68">12 min fa</text>
      </g>

      <line x1="0" y1="320" x2="940" y2="320" stroke="#E5E2D6"/>
      <g transform="translate(0 340)">
        <text x="20" font-weight="600" fill="#0F4F4A">Andrea Russo</text>
        <text x="20" y="18" font-size="11" fill="#5C6B68">+39 366 ••••• 89</text>
        <text x="320" fill="#2A3938">Grazie, a martedì!</text>
        <rect x="700" y="-14" width="84" height="22" rx="11" fill="#DCFCE7"/>
        <text x="742" y="0" font-size="11" font-weight="600" fill="#16A34A" text-anchor="middle">chiusa</text>
        <text x="860" fill="#5C6B68">28 min fa</text>
      </g>
    </g>
  </g>
</svg>
