<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-a16 desc-a16">
  <title id="title-a16">White-label agenzie</title>
  <desc id="desc-a16">Agenzia che gestisce piu' clienti white-label con Ambrogio</desc>
  
  <defs>
