      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="46%" stop-color="#44d9f0"/>
      <stop offset="100%" stop-color="#9764f0"/>
    </linearGradient>
    <linearGradient id="primary-a18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent-a18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow-a18" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="70%" stop-color="#22d3ee" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow-a18" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <filter id="smallShadow-a18" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <pattern id="grid-a18" width="58" height="58" patternUnits="userSpaceOnUse">
