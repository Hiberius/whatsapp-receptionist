<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title-a18 desc-a18">
  <title id="title-a18">Prezzi e fair use</title>
  <desc id="desc-a18">Metriche di utilizzo, fair use e costi provider chiari</desc>
  
  <defs>
