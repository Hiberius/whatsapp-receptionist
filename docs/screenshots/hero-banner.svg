<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="WhatsApp Receptionist — open-source AI receptionist that books real appointments on WhatsApp">
  <title>WhatsApp Receptionist · Crafted in Italy</title>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F6EE"/>
      <stop offset="1" stop-color="#EAE3D2"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F4F4A"/>
      <stop offset="1" stop-color="#0A3935"/>
    </linearGradient>
    <linearGradient id="bubble-gradient" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A6F68"/>
      <stop offset="1" stop-color="#0F4F4A"/>
    </linearGradient>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="1" cy="1" r="0.4" fill="#0F4F4A" opacity="0.05"/>
      <circle cx="3" cy="3" r="0.3" fill="#0F4F4A" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-gradient)"/>
  <rect width="1280" height="640" fill="url(#grain)"/>

  <!-- Right panel: dark accent -->
  <rect x="720" y="0" width="560" height="640" fill="url(#accent-gradient)"/>

  <!-- Decorative dot grid on right -->
  <g fill="#F5F1E8" opacity="0.08">
    <circle cx="780" cy="80" r="2"/><circle cx="820" cy="80" r="2"/><circle cx="860" cy="80" r="2"/>
    <circle cx="900" cy="80" r="2"/><circle cx="940" cy="80" r="2"/><circle cx="980" cy="80" r="2"/>
    <circle cx="1020" cy="80" r="2"/><circle cx="1060" cy="80" r="2"/><circle cx="1100" cy="80" r="2"/>
    <circle cx="1140" cy="80" r="2"/><circle cx="1180" cy="80" r="2"/><circle cx="1220" cy="80" r="2"/>
    <circle cx="780" cy="120" r="2"/><circle cx="820" cy="120" r="2"/><circle cx="860" cy="120" r="2"/>
    <circle cx="900" cy="120" r="2"/><circle cx="940" cy="120" r="2"/><circle cx="980" cy="120" r="2"/>
    <circle cx="1020" cy="120" r="2"/><circle cx="1060" cy="120" r="2"/><circle cx="1100" cy="120" r="2"/>
    <circle cx="1140" cy="120" r="2"/><circle cx="1180" cy="120" r="2"/><circle cx="1220" cy="120" r="2"/>
    <circle cx="780" cy="560" r="2"/><circle cx="820" cy="560" r="2"/><circle cx="860" cy="560" r="2"/>
    <circle cx="900" cy="560" r="2"/><circle cx="940" cy="560" r="2"/><circle cx="980" cy="560" r="2"/>
    <circle cx="1020" cy="560" r="2"/><circle cx="1060" cy="560" r="2"/><circle cx="1100" cy="560" r="2"/>
    <circle cx="1140" cy="560" r="2"/><circle cx="1180" cy="560" r="2"/><circle cx="1220" cy="560" r="2"/>
  </g>

  <!-- Left content: text -->
  <g font-family="Fraunces, Georgia, serif" fill="#0F4F4A">
    <!-- eyebrow -->
    <g font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="2" font-weight="500" fill="#5C6B68">
      <text x="80" y="140">OPEN SOURCE · MIT · CRAFTED IN ITALY</text>
    </g>

    <!-- headline -->
    <text x="80" y="240" font-size="68" font-weight="600" letter-spacing="-2.5">WhatsApp</text>
    <text x="80" y="316" font-size="68" font-weight="400" font-style="italic" letter-spacing="-2.5">Receptionist</text>

    <!-- divider -->
    <rect x="80" y="346" width="48" height="3" fill="#0F4F4A"/>

    <!-- sub-pitch -->
    <g font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#2A3938">
      <text x="80" y="396">The open-source AI receptionist</text>
      <text x="80" y="424">that books real appointments on WhatsApp.</text>
    </g>

    <!-- chips -->
    <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="0.4">
      <g>
        <rect x="80" y="468" width="92" height="32" rx="16" fill="none" stroke="#0F4F4A" stroke-width="1.5"/>
        <text x="126" y="488" text-anchor="middle" fill="#0F4F4A">Next.js 15</text>
      </g>
      <g>
        <rect x="182" y="468" width="120" height="32" rx="16" fill="#0F4F4A"/>
        <text x="242" y="488" text-anchor="middle" fill="#F5F1E8">Opus 4.7 Max</text>
      </g>
      <g>
        <rect x="312" y="468" width="86" height="32" rx="16" fill="none" stroke="#0F4F4A" stroke-width="1.5"/>
        <text x="355" y="488" text-anchor="middle" fill="#0F4F4A">Supabase</text>
      </g>
      <g>
        <rect x="408" y="468" width="100" height="32" rx="16" fill="none" stroke="#0F4F4A" stroke-width="1.5"/>
        <text x="458" y="488" text-anchor="middle" fill="#0F4F4A">GDPR-ready</text>
      </g>
    </g>

    <!-- author -->
    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#5C6B68">
      <text x="80" y="568">github.com/Hiberius/whatsapp-receptionist · MIT License</text>
    </g>
  </g>

  <!-- Right panel: chat bubble illustration -->
  <g transform="translate(900 180)">
    <!-- Outer card -->
    <rect x="-120" y="-20" width="320" height="280" rx="20" fill="#F5F1E8" opacity="0.06"/>

    <!-- Bubble 1 (user) -->
    <g transform="translate(-90 0)">
      <rect width="200" height="56" rx="14" fill="#F5F1E8" opacity="0.15"/>
      <text x="20" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F5F1E8">Salve, vorrei prenotare</text>
      <text x="20" y="50" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F5F1E8">una visita per martedì</text>
    </g>

    <!-- Bubble 2 (AI) -->
    <g transform="translate(20 80)">
      <rect width="220" height="86" rx="14" fill="url(#bubble-gradient)" stroke="#F5F1E8" stroke-width="1" stroke-opacity="0.25"/>
      <!-- AI dot -->
      <circle cx="20" cy="22" r="4" fill="#E8C56A"/>
      <text x="34" y="26" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#E8C56A">AI</text>
      <text x="20" y="50" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F5F1E8">Certo. Ho disponibilità</text>
      <text x="20" y="66" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F5F1E8">martedì alle 10:30 o 15:00.</text>
      <text x="20" y="82" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#E8C56A">Quale preferisce?</text>
    </g>

    <!-- typing indicator -->
    <g transform="translate(-90 200)">
      <rect width="60" height="24" rx="12" fill="#F5F1E8" opacity="0.15"/>
      <circle cx="18" cy="12" r="3" fill="#F5F1E8"/>
      <circle cx="30" cy="12" r="3" fill="#F5F1E8" opacity="0.6"/>
      <circle cx="42" cy="12" r="3" fill="#F5F1E8" opacity="0.3"/>
    </g>
  </g>

  <!-- Italian flag accent (small, bottom-right of left panel) -->
  <g transform="translate(80 600)">
    <rect x="0" y="0" width="8" height="20" fill="#008C45"/>
    <rect x="8" y="0" width="8" height="20" fill="#F5F1E8"/>
    <rect x="16" y="0" width="8" height="20" fill="#CD212A"/>
    <text x="36" y="15" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#5C6B68">Made in Italy</text>
  </g>
</svg>
